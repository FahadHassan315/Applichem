<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}" />
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/applichem-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1a7abf;
      --blue-dark: #0e5a8a;
      --green: #3a7d44;
      --ink: #132231;
      --muted: #657489;
      --line: #dbe9f2;
      --paper: #f6f9fb;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.72;
    }

    a { color: var(--blue); }

    .site-header {
      background: white;
      border-bottom: 1px solid var(--line);
      padding: 14px 5%;
    }

    .brand-link {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--blue-dark);
      text-decoration: none;
      font-weight: 800;
    }

    .brand-logo-frame {
      width: 66px;
      height: 48px;
      display: grid;
      place-items: center;
      background-color: white;
      border: 1px solid rgba(26, 122, 191, 0.22);
      border-radius: 8px;
      overflow: hidden;
    }

    .brand-logo-frame img {
      width: 58px;
      height: 41px;
      object-fit: contain;
      mix-blend-mode: multiply;
      display: block;
    }

    .post-hero {
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      color: white;
      padding: 70px 5% 58px;
    }

    .post-hero-inner {
      width: min(860px, 100%);
      margin: 0 auto;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      background: rgba(58, 125, 68, 0.72);
      color: white;
      text-decoration: none;
      font-size: 0.82rem;
    }

    h1 {
      margin: 0 0 16px;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(2.25rem, 6vw, 4.2rem);
      line-height: 1.04;
    }

    .description {
      max-width: 720px;
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 1.08rem;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: -28px auto 70px;
      padding: 42px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(14, 90, 138, 0.1);
    }

    .post-content { font-size: 1.04rem; }

    .post-content h2,
    .post-content h3 {
      color: var(--blue-dark);
      line-height: 1.25;
      margin-top: 2rem;
      margin-bottom: 0.7rem;
    }

    .post-content h2 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 1.85rem;
    }

    .post-content h3 { font-size: 1.24rem; }
    .post-content p { margin: 0 0 1.1rem; }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 28px;
      margin-top: 34px;
      border-top: 1px solid var(--line);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 800;
      text-decoration: none;
    }

    .button-secondary {
      color: var(--blue-dark);
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .button-primary {
      color: white;
      background: var(--green);
    }

    @media (max-width: 680px) {
      .post-hero { padding-top: 52px; }
      main {
        width: calc(100% - 22px);
        padding: 28px 20px;
      }
      .post-actions .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand-link" href="{{ site.baseurl }}/">
      <span class="brand-logo-frame">
        <picture>
          <source srcset="{{ site.baseurl }}/applichem_logo_hq.webp" type="image/webp" />
          <img src="{{ site.baseurl }}/applichem_logo_hq.png" width="758" height="540" loading="eager" fetchpriority="high" alt="Applichem logo" />
        </picture>
      </span>
      <span>Applichem - Building Solution Provider</span>
    </a>
  </header>

  <section class="post-hero">
    <div class="post-hero-inner">
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% for category in page.categories %}
          <span class="tag">{{ category }}</span>
        {% endfor %}
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="description">{{ page.description }}</p>
      {% endif %}
    </div>
  </section>

  <main>
    <article class="post-content">
      {{ content }}
    </article>

    <div class="post-actions">
      <a class="button button-secondary" href="{{ site.baseurl }}/blog.html">Back to Blog</a>
      <a class="button button-primary" href="{{ site.baseurl }}/#contact">Get a Free Quote</a>
    </div>
  </main>
</body>
</html>
